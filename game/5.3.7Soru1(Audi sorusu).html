<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audi Geometrisi: Merkezler ve Üçgen</title>
    <style>
        :root {
            --audi-red: #bb0a30;
            --chrome-light: #f0f0f0;
            --text-light: #e0e0e0;
            --bg-dark-grad: radial-gradient(circle at center, #2c2c2e 0%, #1a1a1d 100%);
            --panel-bg: linear-gradient(145deg, #2a2a2d, #1f1f22);
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg-dark-grad);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .header-section { text-align: center; margin-bottom: 30px; }
        h1 { font-weight: 300; margin: 0 0 10px 0; letter-spacing: 3px; text-transform: uppercase; }
        .brand-names { color: #888; font-size: 14px; word-spacing: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        .main-content-wrapper {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        .canvas-container-style {
            flex: 2;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas { border-radius: 12px; cursor: crosshair; max-width: 100%; height: auto; }

        .controls-panel {
            flex: 1;
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-radius: 20px;
            border-left: 4px solid var(--audi-red);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            min-width: 300px;
        }

        #instruction {
            font-size: 18px;
            font-weight: 500;
            color: var(--chrome-light);
            margin-bottom: 25px;
            min-height: 28px;
            line-height: 1.4;
        }

        .btn-group {
            display: none;
            gap: 10px;
            flex-direction: column;
            width: 100%;
        }

        button {
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            background: linear-gradient(to right, #444, #333);
            color: var(--text-light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button::after { content: '→'; opacity: 0.5; transition: transform 0.3s; }
        button:hover:not(:disabled) {
            background: linear-gradient(to right, #555, #444);
            transform: translateX(5px);
        }
        button:hover:not(:disabled)::after { transform: translateX(5px); opacity: 1; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .correct { background: linear-gradient(to right, #2e7d32, #1b5e20) !important; }
        .wrong { background: linear-gradient(to right, #c62828, #b71c1c) !important; }
        .correct::after { content: '✓'; } .wrong::after { content: '✗'; }

        #reset-btn {
            margin-top: 25px;
            background: transparent;
            border: 2px solid #555;
            color: #aaa;
            justify-content: center;
            text-align: center;
        }
        #reset-btn:hover { border-color: #888; color: var(--text-light); transform: none; }
        #reset-btn::after { content: none; }
        
        .explanation {
            margin-top: 25px;
            font-size: 15px;
            color: var(--text-light);
            display: none;
            background: rgba(var(--audi-red-rgb), 0.15);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            border-top: 3px solid var(--audi-red);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .highlight { color: var(--audi-red); font-weight: bold; }

        @media (max-width: 900px) {
            .main-content-wrapper { flex-direction: column; align-items: center; }
            .canvas-container-style, .controls-panel { width: 100%; max-width: 740px; }
            .btn-group { flex-direction: row; flex-wrap: wrap; }
            button { flex: 1 1 45%; text-align: center; justify-content: center; }
            button::after { display: none; }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>Audi Geometrisi</h1>
        <div class="brand-names">Audi DKW Horch Wanderer</div>
    </div>

    <div class="main-content-wrapper">
        <div class="canvas-container-style">
            <canvas id="logoCanvas" width="740" height="320"></canvas>
        </div>

        <div class="controls-panel">
            <div id="instruction">Adım 1: Audi (A) ve DKW (D) halkalarının merkezlerini (noktaları) bulun.</div>
            
            <div class="btn-group" id="quiz-options">
                <button onclick="checkAnswer('eskenar', this)">Eşkenar Üçgen</button>
                <button onclick="checkAnswer('ikizkenar', this)">İkizkenar Üçgen</button>
                <button onclick="checkAnswer('cesitkenar', this)">Çeşitkenar Üçgen</button>
                <button onclick="checkAnswer('dik', this)">Dik Üçgen</button>
            </div>
            
            <div id="explanation" class="explanation"></div>
            <button id="reset-btn" onclick="resetGame()">Simülasyonu Sıfırla</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d');
    const instruction = document.getElementById('instruction');
    const quizOptions = document.getElementById('quiz-options');
    const explanation = document.getElementById('explanation');

    const radius = 70;
    const spacing = 95; 
    const startX = 180;
    const centerY = 160;
    const ringThickness = 15;
    
    const centers = [
        { x: startX, y: centerY, name: 'Audi', initial: 'A' },
        { x: startX + spacing, y: centerY, name: 'DKW', initial: 'D' },
        { x: startX + spacing * 2, y: centerY, name: 'Horch', initial: 'H' },
        { x: startX + spacing * 3, y: centerY, name: 'Wanderer', initial: 'W' }
    ];

    const intersectX = (centers[0].x + centers[1].x) / 2;
    const intersectY = centerY - Math.sqrt(radius**2 - (spacing/2)**2);
    const intersectionPoint = { x: intersectX, y: intersectY };

    let step = 0;
    let clickedCenters = 0;

    function drawChromeRing(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        const grad = ctx.createLinearGradient(x, y - r, x, y + r);
        grad.addColorStop(0.0, '#e6e6e6');
        grad.addColorStop(0.2, '#bcbcbc');
        grad.addColorStop(0.45, '#666666');
        grad.addColorStop(0.55, '#888888');
        grad.addColorStop(0.8, '#bcbcbc');
        grad.addColorStop(1.0, '#444444');
        ctx.strokeStyle = grad;
        ctx.lineWidth = ringThickness;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 6;
        ctx.stroke();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
    }

    // --- YENİ: Merkez Noktalarını Çizme ---
    function drawCenterPoint(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#222"; // Koyu gri nokta
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.5)"; // Hafif çerçeve
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // --- GÜNCELLENDİ: Harfleri Yukarı Taşıma ---
    function drawInitials() {
        ctx.font = "bold 24px 'Arial', sans-serif"; // Font boyutunu biraz küçülttük, daha zarif olsun
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        ctx.fillStyle = "#a0a0a0";
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;

        centers.forEach(c => {
            // Y koordinatını (c.y - 45) yaparak harfi halkanın üst kısmına aldık
            ctx.fillText(c.initial, c.x, c.y - 45);
        });

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
    }

    function drawLogo() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. Halkalar
        centers.forEach(c => {
            drawChromeRing(c.x, c.y, radius);
        });

        // 2. Harfler (Üstte)
        drawInitials();

        // 3. Merkez Noktaları (Ortada)
        centers.forEach(c => {
            drawCenterPoint(c.x, c.y);
        });
    }

    // Etkileşim Hedefi (Parlayan Nokta)
    function drawTargetPoint(x, y, isActive) {
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = isActive ? '#bb0a30' : 'rgba(255,255,255,0.9)'; // Pasifken beyaz nokta
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(x, y, 14, 0, Math.PI * 2); // Tıklama alanı vurgusu
        ctx.strokeStyle = isActive ? 'rgba(187, 10, 48, 0.6)' : 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawTriangle() {
        ctx.beginPath();
        ctx.moveTo(centers[0].x, centers[0].y);
        ctx.lineTo(intersectionPoint.x, intersectionPoint.y);
        ctx.lineTo(centers[1].x, centers[1].y);
        ctx.closePath();
        
        ctx.strokeStyle = '#ff1744';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(187, 10, 48, 0.2)';
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = "bold 20px Arial";
        ctx.shadowColor = 'rgba(0,0,0,1)';
        ctx.shadowBlur = 4;
        ctx.textAlign = "center";
        
        // r harflerini kenarların ortasına yerleştir
        ctx.fillText("r", (centers[0].x + intersectionPoint.x)/2 - 15, (centers[0].y + intersectionPoint.y)/2);
        ctx.fillText("r", (centers[1].x + intersectionPoint.x)/2 + 15, (centers[1].y + intersectionPoint.y)/2);
        ctx.shadowBlur = 0;
    }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        if (step === 0) {
            [centers[0], centers[1]].forEach(c => {
                const dist = Math.hypot(mouseX - c.x, mouseY - c.y);
                if (dist < 30 && !c.clicked) { // Tıklama alanını biraz genişlettik (rahatlık için)
                    c.clicked = true;
                    clickedCenters++;
                    drawScene();
                }
            });
            if (clickedCenters === 2) {
                step = 1;
                instruction.innerText = "Adım 2: Şimdi bu iki halkanın üstteki kesişim noktasına tıklayın.";
                drawScene();
            }
        } else if (step === 1) {
            const dist = Math.hypot(mouseX - intersectionPoint.x, mouseY - intersectionPoint.y);
            if (dist < 30) {
                step = 2;
                instruction.innerText = "Soru: Oluşan bu parlak kırmızı üçgenin çeşidi nedir?";
                quizOptions.style.display = "flex";
                drawScene();
            }
        }
    });

    function drawScene() {
        drawLogo();
        // Adım 0: Merkezlere tıklama
        if (step === 0) {
            if (!centers[0].clicked) drawTargetPoint(centers[0].x, centers[0].y, false);
            if (!centers[1].clicked) drawTargetPoint(centers[1].x, centers[1].y, false);
        }
        // Tıklanan merkezleri göster
        if (centers[0].clicked) drawTargetPoint(centers[0].x, centers[0].y, true);
        if (centers[1].clicked) drawTargetPoint(centers[1].x, centers[1].y, true);

        // Adım 1: Kesişim
        if (step === 1) drawTargetPoint(intersectionPoint.x, intersectionPoint.y, false);
        
        // Adım 2: Üçgen
        if (step >= 2) {
            drawTargetPoint(intersectionPoint.x, intersectionPoint.y, true);
            drawTriangle();
        }
    }

    function checkAnswer(answer, btnElement) {
        const buttons = quizOptions.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);

        if (answer === 'ikizkenar') {
            btnElement.classList.add('correct');
            instruction.innerHTML = "✅ Mükemmel! Doğru Analiz.";
            explanation.style.display = "block";
            explanation.innerHTML = `
                <strong>Neden İkizkenar Üçgen?</strong><br><br>
                1. <strong>A</strong> ve <strong>D</strong> noktaları çemberlerin merkezleridir.<br>
                2. Üçgenin kolları, merkezden çember üzerindeki kesişim noktasına gider.<br>
                3. Merkezden çembere giden her doğru parçası <span class="highlight">Yarıçaptır (r)</span>.<br>
                4. Audi halkaları eş olduğu için yarıçapları eşittir. İki kenarı eşit olan üçgen <strong>İkizkenardır</strong>.
            `;
        } else {
            btnElement.classList.add('wrong');
            instruction.innerHTML = "❌ Hatalı. Kenarlardaki 'r' harflerine dikkat et.";
            setTimeout(() => {
                buttons.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
                instruction.innerText = "Tekrar deneyin: Bu üçgenin çeşidi nedir?";
            }, 2500);
        }
    }

    function resetGame() {
        step = 0;
        clickedCenters = 0;
        centers.forEach(c => c.clicked = false);
        instruction.innerText = "Adım 1: Audi (A) ve DKW (D) halkalarının merkezlerini (noktaları) bulun.";
        quizOptions.style.display = "none";
        explanation.style.display = "none";
        const buttons = quizOptions.querySelectorAll('button');
        buttons.forEach(b => { b.disabled = false; b.classList.remove('correct', 'wrong'); });
        drawScene();
    }

    drawScene();
    setTimeout(drawScene, 100);

</script>

</body>
</html>
