<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnteraktif Üçgen Analizi - Tür Analizi</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            display: flex;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 1100px;
            width: 100%;
            gap: 20px;
            align-items: flex-start;
        }

        .left-column {
            flex: 3;
            text-align: center;
            position: relative;
        }

        .right-column {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 50px;
        }

        canvas {
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 4px;
            max-width: 100%; 
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        input[type=range] {
            width: 90%;
            cursor: pointer;
        }

        .step-info {
            margin-top: 10px;
            font-size: 1.1em;
            color: #333;
            font-weight: bold;
            min-height: 40px;
        }

        #checkboxArea {
            display: none;
            background-color: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #2196f3;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        #checkboxArea label {
            cursor: pointer;
            font-weight: bold;
            color: #1565c0;
            user-select: none;
        }

        #resultPanel {
            display: none;
            background-color: #fff8e1;
            border: 1px solid #ffb300;
            border-radius: 8px;
            padding: 15px;
            font-size: 0.95em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: fadeIn 0.4s ease-out;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-weight: bold;
            border-bottom: 2px solid #ffb300;
            padding-bottom: 5px;
            margin-bottom: 15px;
            color: #ef6c00;
            text-align: center;
        }

        .highlight {
            color: #d84315;
            font-weight: bold;
            font-size: 1.2em;
            background-color: #ffe0b2;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .disabled-slider {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .side-box {
            display: inline-block;
            background: #fff;
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            margin: 2px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <div class="left-column">
        <h2 style="margin: 0 0 10px 0; color: #444;">📐 Geometrik Çizim ve Analiz</h2>
        
        <canvas id="geoCanvas" width="750" height="450"></canvas>

        <div class="controls">
            <div class="step-info" id="stepDisplay">Başlangıç</div>
            <input type="range" id="slider" min="0" max="6" value="0" step="1">
            <div style="font-size: 0.8em; color: #666; margin-top:5px;">(Animasyon için slider'ı hareket ettirin)</div>
        </div>
    </div>

    <div class="right-column">
        
        <div id="checkboxArea">
            <input type="checkbox" id="toggleResult">
            <label for="toggleResult">Üçgen Çeşidini Göster</label>
        </div>

        <div id="resultPanel"></div>

    </div>
</div>

<script>
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('slider');
    const stepDisplay = document.getElementById('stepDisplay');
    
    const checkboxArea = document.getElementById('checkboxArea');
    const toggleResult = document.getElementById('toggleResult');
    const resultPanel = document.getElementById('resultPanel');

    // --- GEOMETRİK DEĞİŞKENLER ---
    const scale = 27; 
    const startX = 226; 
    const startY = 225; 
    
    // Kenar uzunlukları (cm)
    const r1 = 5;    // Sol kenar
    const dist = 9;  // Alt kenar
    const r2 = 7;    // Sağ kenar

    // Kesişim Noktası Hesaplama
    const x_loc = (dist * dist - r2 * r2 + r1 * r1) / (2 * dist);
    const y_loc = Math.sqrt(r1 * r1 - x_loc * x_loc);
    
    const Ax = startX + (x_loc * scale);
    const Ay = startY - (y_loc * scale);
    const Bx = Ax;
    const By = startY + (y_loc * scale);
    const O2x = startX + (dist * scale);

    const steps = [
        "Hazırlık: Kağıt ve kalem hazır.",
        "1. Adım: Pergel 5 cm açıldı, O₁ merkezli çember çiziliyor...",
        "2. Adım: Cetvelle 9 cm ölçülüp çiziliyor...",
        "3. Adım: Pergel 7 cm açıldı, O₂ merkezli çember çiziliyor...",
        "4. Adım: Kesişim noktaları A ve B belirlendi.",
        "5. Adım: Noktalar cetvel ile birleştiriliyor...",
        "6. Adım: Tamamlandı."
    ];

    let currentStep = 0;
    let animProgress = 0;
    let isAnimating = false;
    let animationId = null;

    // --- ANALİZ FONKSİYONU (GÜNCELLENDİ) ---
    function updateAnalysis() {
        // Tür Belirleme ve Açıklama Mantığı
        let typeText = "";
        let explanation = "";
        let mathComparison = "";

        if (r1 === dist && dist === r2) {
            typeText = "EŞKENAR ÜÇGEN";
            mathComparison = `${r1} = ${dist} = ${r2}`;
            explanation = "Bütün kenar uzunlukları birbirine eşit olduğu için bu bir eşkenar üçgendir.";
        } else if (r1 === dist || r1 === r2 || dist === r2) {
            typeText = "İKİZKENAR ÜÇGEN";
            explanation = "İki kenar uzunluğu birbirine eşit olduğu için bu bir ikizkenar üçgendir.";
            // Hangi kenarların eşit olduğunu bulmak için basit kontrol (görsel için gerekli değil ama mantık burada)
        } else {
            typeText = "ÇEŞİTKENAR ÜÇGEN";
            mathComparison = `${r1} ≠ ${dist} ≠ ${r2}`;
            explanation = "Bütün kenar uzunlukları birbirinden farklı olduğu için bu bir çeşitkenar üçgendir.";
        }

        // HTML İçeriğini Oluştur
        let html = `
            <div class="result-title">📊 KENARLARINA GÖRE ANALİZ</div>
            
            <p style="text-align:center; margin-bottom:5px;"><strong>Ölçülen Kenarlar:</strong></p>
            <div style="text-align:center; margin-bottom:15px;">
                <span class="side-box">${r1} cm</span>
                <span class="side-box">${dist} cm</span>
                <span class="side-box">${r2} cm</span>
            </div>

            <div style="background:#fff; padding:10px; border-left:4px solid #ff9800; margin-bottom:15px;">
                <p style="margin:0; color:#555;">Karşılaştırma:</p>
                <p style="margin:5px 0 0 0; font-family:monospace; font-size:1.2em; font-weight:bold;">
                    ${mathComparison}
                </p>
            </div>
            
            <p style="text-align: center; margin-bottom:5px;">Sonuç:</p>
            <div style="text-align: center; margin-bottom: 15px;">
                <span class="highlight">${typeText}</span>
            </div>

            <p style="font-size:0.9em; color:#444; border-top:1px dashed #ccc; padding-top:10px;">
                <em>${explanation}</em>
            </p>
        `;

        resultPanel.innerHTML = html;
    }

    // --- ÇİZİM FONKSİYONLARI (AYNI KALDI) ---
    function drawPencil(x, y, angle = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#FFC107";
        ctx.fillRect(-5, -60, 10, 50);
        ctx.beginPath(); ctx.moveTo(-5, -10); ctx.lineTo(5, -10); ctx.lineTo(0, 0); 
        ctx.fillStyle = "#F5DEB3"; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2, -4); ctx.lineTo(2, -4); ctx.lineTo(0, 0);
        ctx.fillStyle = "#333"; ctx.fill();
        ctx.restore();
    }

    function drawCompass(cx, cy, radiusPx, angleRad) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angleRad); 
        ctx.strokeStyle = "#546E7A"; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10, -120); ctx.stroke();
        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(0,0, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(radiusPx, 0); ctx.lineTo(10, -120); ctx.stroke();
        ctx.beginPath(); ctx.arc(10, -120, 8, 0, Math.PI*2); ctx.fillStyle = "#455A64"; ctx.fill();
        drawPencil(radiusPx, 0, -Math.PI/4);
        ctx.restore();
    }

    function drawRuler(x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const distPx = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx);
        ctx.save();
        ctx.translate(x1, y1);
        ctx.rotate(angle);
        ctx.fillStyle = "rgba(255, 235, 59, 0.7)"; 
        ctx.fillRect(-10, 5, distPx + 20, 35);
        ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<=distPx; i+=10) { ctx.moveTo(i, 5); ctx.lineTo(i, 15); }
        ctx.stroke();
        ctx.restore();
    }

    function drawPoint(x, y, label) {
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fillStyle = "red"; ctx.fill();
        ctx.font = "bold 14px Arial"; ctx.fillStyle = "black"; ctx.fillText(label, x - 5, y - 10);
    }

    function drawLine(x1, y1, x2, y2, color, width) {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    }

    function drawCircle(x, y, r, color, maxAngle = Math.PI * 2) {
        ctx.beginPath(); ctx.arc(x, y, r * scale, 0, maxAngle);
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "#f0f0f0"; ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += scale) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        for (let i = 0; i < canvas.height; i += scale) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

        if (currentStep >= 0) drawPoint(startX, startY, "O₁");

        if (currentStep > 1) {
            drawCircle(startX, startY, r1, "#2196F3");
        } else if (currentStep === 1) {
            const angle = animProgress * Math.PI * 2;
            drawCircle(startX, startY, r1, "#2196F3", angle);
            drawCompass(startX, startY, r1 * scale, angle);
        }

        if (currentStep > 2) {
            drawPoint(O2x, startY, "O₂");
            drawLine(startX, startY, O2x, startY, "#555", 1);
            ctx.fillStyle = "#555"; ctx.fillText(dist + " cm", (startX+O2x)/2, startY+20);
        } else if (currentStep === 2) {
            const currX = startX + (O2x - startX) * animProgress;
            drawLine(startX, startY, currX, startY, "#555", 1);
            drawRuler(startX, startY, O2x, startY);
            drawPencil(currX, startY, -0.5);
            if (animProgress > 0.95) drawPoint(O2x, startY, "O₂");
        }

        if (currentStep > 3) {
            drawCircle(O2x, startY, r2, "#4CAF50");
        } else if (currentStep === 3) {
            const angle = Math.PI - (animProgress * Math.PI * 2); 
            drawCircle(O2x, startY, r2, "#4CAF50", Math.PI * 2 * animProgress); 
            drawCompass(O2x, startY, r2 * scale, (animProgress * Math.PI * 2));
        }

        if (currentStep >= 4) { drawPoint(Ax, Ay, "A"); drawPoint(Bx, By, "B"); }

        if (currentStep > 5) {
            drawLine(startX, startY, Ax, Ay, "#D32F2F", 3);
            drawLine(O2x, startY, Ax, Ay, "#D32F2F", 3);
            drawLine(startX, startY, O2x, startY, "#D32F2F", 3);
            ctx.fillStyle = "#D32F2F";
            ctx.fillText(r1 + " cm", (startX+Ax)/2 - 20, (startY+Ay)/2);
            ctx.fillText(r2 + " cm", (O2x+Ax)/2 + 10, (startY+Ay)/2);
        } else if (currentStep === 5) {
            if (animProgress < 0.33) {
                const localProg = animProgress / 0.33;
                const currX = startX + (Ax - startX) * localProg;
                const currY = startY + (Ay - startY) * localProg;
                drawRuler(startX, startY, Ax, Ay);
                drawLine(startX, startY, currX, currY, "#D32F2F", 3);
                drawPencil(currX, currY, -0.5);
            } else if (animProgress < 0.66) {
                drawLine(startX, startY, Ax, Ay, "#D32F2F", 3);
                const localProg = (animProgress - 0.33) / 0.33;
                const currX = Ax + (O2x - Ax) * localProg;
                const currY = Ay + (startY - Ay) * localProg;
                drawRuler(Ax, Ay, O2x, startY);
                drawLine(Ax, Ay, currX, currY, "#D32F2F", 3);
                drawPencil(currX, currY, -0.5);
            } else {
                drawLine(startX, startY, Ax, Ay, "#D32F2F", 3);
                drawLine(Ax, Ay, O2x, startY, "#D32F2F", 3);
                const localProg = (animProgress - 0.66) / 0.34;
                const currX = O2x + (startX - O2x) * localProg;
                drawRuler(O2x, startY, startX, startY);
                drawLine(O2x, startY, currX, startY, "#D32F2F", 3);
                drawPencil(currX, startY, -0.5);
            }
        }

        stepDisplay.innerText = steps[currentStep];

        if (currentStep === 6 && animProgress >= 1) {
            checkboxArea.style.display = 'block';
        } else {
            checkboxArea.style.display = 'none';
            resultPanel.style.display = 'none';
            toggleResult.checked = false;
        }
    }

    function animate() {
        if (!isAnimating) return;
        animProgress += 0.015;
        if (animProgress >= 1) {
            animProgress = 1;
            isAnimating = false;
            slider.disabled = false;
            slider.classList.remove("disabled-slider");
            drawScene();
        } else {
            drawScene();
            animationId = requestAnimationFrame(animate);
        }
    }

    slider.addEventListener('input', function() {
        const targetStep = parseInt(this.value);
        if (targetStep > currentStep) {
            currentStep = targetStep;
            if ([1, 2, 3, 5].includes(currentStep)) {
                animProgress = 0;
                isAnimating = true;
                slider.disabled = true;
                slider.classList.add("disabled-slider");
                animate();
            } else {
                animProgress = 1;
                drawScene();
            }
        } else {
            currentStep = targetStep;
            animProgress = 1;
            drawScene();
        }
    });

    toggleResult.addEventListener('change', function() {
        if (this.checked) {
            updateAnalysis();
            resultPanel.style.display = 'block';
        } else {
            resultPanel.style.display = 'none';
        }
    });

    drawScene();

</script>

</body>
</html>
