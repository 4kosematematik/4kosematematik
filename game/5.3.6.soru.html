<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadeleştirilmiş Üçgen Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #2d3436;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
            min-height: 600px;
            border: 4px solid #fff;
        }

        /* SOL PANEL */
        .left-panel {
            flex: 2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #dfe6e9;
        }

        /* SAĞ PANEL */
        .right-panel {
            flex: 1;
            background: #fdfbf7;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 { color: #00b894; margin: 0 0 10px 0; font-weight: 900; }
        p { color: #636e72; margin-bottom: 20px; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: radial-gradient(circle, #ffffff 0%, #ecf0f1 100%);
            border-radius: 20px;
            border: 2px solid #eee;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
        }
        
        canvas {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
        }

        /* Bilgi kutusu stilleri kaldırıldı */

        .controls-box {
            background: #dfe6e9;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 20px;
        }

        .slider-group { flex: 1; text-align: center; }
        label { display: block; font-weight: 800; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #0984e3; }
        
        .question-btn {
            background: white;
            border: 2px solid #81ecec;
            color: #636e72;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .question-btn:hover {
            transform: translateX(5px);
            border-color: #00cec9;
            color: #00b894;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0, 206, 201, 0.2);
        }
        .icon { font-size: 1.5em; margin-right: 15px; min-width: 30px; text-align: center;}

        .type-badge {
            margin-top: 20px;
            padding: 15px;
            background: #0984e3;
            color: white;
            text-align: center;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1.2em;
        }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .left-panel { border-right: none; border-bottom: 2px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="left-panel">
        <h2>📐 Kenar ve Açı Laboratuvarı</h2>
        <p>Açıları değiştirin, kenar uzunluklarının nasıl değiştiğini izleyin.</p>
        
        <div class="canvas-wrapper">
            <canvas id="triCanvas" width="600" height="400"></canvas>
            <!-- Bilgi kutusu div'i kaldırıldı -->
        </div>

        <div class="controls-box">
            <div class="slider-group">
                <label style="color:#e17055">m(A) Açısı</label>
                <input type="range" id="angleA" min="1" max="179" value="60">
            </div>
            <div class="slider-group">
                <label style="color:#0984e3">m(B) Açısı</label>
                <input type="range" id="angleB" min="1" max="179" value="60">
            </div>
        </div>

        <div id="typeBadge" class="type-badge">Eşkenar Üçgen</div>
    </div>

    <div class="right-panel">
        <h3 style="color:#2d3436; margin-bottom:20px;">❓ Bunları Deneyelim</h3>
        
        <button class="question-btn" onclick="setScenario(90, 90)">
            <span class="icon">❌</span> 
            <div>
                <strong>İki Dik Açı?</strong><br>
                <small>Kenarlar paralel gider!</small>
            </div>
        </button>

        <button class="question-btn" onclick="setScenario(100, 100)">
            <span class="icon">⛔</span> 
            <div>
                <strong>İki Geniş Açı?</strong><br>
                <small>100° + 100° mümkün mü?</small>
            </div>
        </button>
        <button class="question-btn" onclick="setScenario(90, 45)">
            <span class="icon">✨</span> 
            <div>
                <strong>İkizkenar Dik</strong><br>
                <small>a ve b kenarı eşit mi?</small>
            </div>
        </button>

        <button class="question-btn" onclick="setScenario(60, 60)">
            <span class="icon">💎</span> 
            <div>
                <strong>Eşkenar Üçgen</strong><br>
                <small>a = b = c = 10 br</small>
            </div>
        </button>
        
        <button class="question-btn" onclick="setScenario(120, 30)">
            <span class="icon">📏</span> 
            <div>
                <strong>Geniş Açılı İkizkenar</strong><br>
                <small>En uzun kenarı bul</small>
            </div>
        </button>
    </div>
</div>

<script>
    const canvas = document.getElementById('triCanvas');
    const ctx = canvas.getContext('2d');
    
    const inpA = document.getElementById('angleA');
    const inpB = document.getElementById('angleB');
    const typeBadge = document.getElementById('typeBadge');

    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;
    const PADDING = 80;
    const FIXED_BASE_UNIT = 10.0; // Tabanı her zaman 10 birim kabul ediyoruz
    const DRAW_BASE_LEN = 300; // Çizimdeki piksel karşılığı (başlangıç)

    function draw() {
        let angA = parseInt(inpA.value);
        let angB = parseInt(inpB.value);
        let angC = 180 - (angA + angB);
        
        let isValid = (angC > 0);

        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

        // --- KENAR HESAPLAMA (Sinüs Teoremi) ---
        let rA = angA * Math.PI / 180;
        let rB = angB * Math.PI / 180;
        let rC = angC * Math.PI / 180;

        let valSideA = 0; // a kenarı
        let valSideB = 0; // b kenarı
        let valSideC = FIXED_BASE_UNIT;

        if (isValid) {
            valSideA = (valSideC * Math.sin(rA)) / Math.sin(rC);
            valSideB = (valSideC * Math.sin(rB)) / Math.sin(rC);
        }

        // --- ÇİZİM İÇİN KOORDİNAT HESABI (Auto Zoom) ---
        let drawHeight = 0;
        let drawBase = DRAW_BASE_LEN;
        
        if (isValid) {
            drawHeight = (drawBase * Math.sin(rA) * Math.sin(rB)) / Math.sin(rC);
        } else {
            drawHeight = 200;
        }

        // Zoom/Ölçekleme
        let availableH = CANVAS_H - (PADDING * 2);
        let zoom = 1;
        if (isValid) {
            if (drawHeight > availableH) zoom = availableH / drawHeight;
            if (drawHeight > availableH * 3) zoom = 0.25; 
        }
        
        let finalBase = drawBase * zoom;
        
        // Merkezleme
        let Ay = CANVAS_H - PADDING;
        let By = CANVAS_H - PADDING;
        let Ax = (CANVAS_W - finalBase) / 2;
        let Bx = Ax + finalBase;

        let Cx, Cy;

        if (isValid) {
            let pixelSideB = (finalBase * Math.sin(rB)) / Math.sin(rC);
            Cx = Ax + pixelSideB * Math.cos(rA);
            Cy = Ay - pixelSideB * Math.sin(rA);
        } else {
            let failLen = Math.min(200, CANVAS_H/2);
            Cx = Ax + failLen * Math.cos(rA);
            Cy = Ay - failLen * Math.sin(rA);
        }

        // --- ÇİZİM ---
        
        // 1. Taban (c kenarı)
        ctx.beginPath();
        ctx.moveTo(Ax, Ay);
        ctx.lineTo(Bx, By);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#2d3436";
        ctx.stroke();

        // Taban Etiketi (c)
        if (isValid) drawLabel((Ax+Bx)/2, Ay + 35, `c=${valSideC.toFixed(1)}`);

        // 2. Sol Kol (b kenarı)
        ctx.beginPath();
        ctx.moveTo(Ax, Ay);
        ctx.lineTo(Cx, Cy);
        ctx.strokeStyle = "#e17055"; 
        if (!isValid) ctx.setLineDash([10, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Sol Kol Etiketi (b)
        if (isValid) drawLabel((Ax+Cx)/2 - 30, (Ay+Cy)/2, `b=${valSideB.toFixed(1)}`);

        // 3. Sağ Kol (a kenarı)
        ctx.beginPath();
        ctx.moveTo(Bx, By);
        if (isValid) {
            ctx.lineTo(Cx, Cy);
        } else {
            // Paralel/Geniş durum kolu
            let failLen = Math.min(200, CANVAS_H/2);
            let angleX = Math.PI - rB;
            let ex = Bx + failLen * Math.cos(angleX);
            let ey = By - failLen * Math.sin(angleX);
            ctx.lineTo(ex, ey);
        }
        ctx.strokeStyle = "#0984e3";
        if (!isValid) ctx.setLineDash([10, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Sağ Kol Etiketi (a)
        if (isValid) drawLabel((Bx+Cx)/2 + 30, (By+Cy)/2, `a=${valSideA.toFixed(1)}`);


        // AÇILARI ÇİZ VE GÖSTER (Yeni Eklenen Kısım)
        if (isValid) {
            // A Açısı: B-A-C
            drawAngleArc(Ax, Ay, Bx, By, Cx, Cy, angA + "°", "#e17055");
            // B Açısı: A-B-C
            drawAngleArc(Bx, By, Cx, Cy, Ax, Ay, angB + "°", "#0984e3");
            // C Açısı: A-C-B
            drawAngleArc(Cx, Cy, Ax, Ay, Bx, By, angC + "°", "#00b894");
        }


        // Noktalar
        drawDot(Ax, Ay, "A");
        drawDot(Bx, By, "B");
        if (isValid) {
            drawDot(Cx, Cy, "C");
            // Dolgu
            ctx.beginPath();
            ctx.moveTo(Ax, Ay);
            ctx.lineTo(Bx, By);
            ctx.lineTo(Cx, Cy);
            ctx.fillStyle = "rgba(108, 92, 231, 0.1)";
            ctx.fill();
        }

        updateStatus(isValid, angA, angB, angC, valSideA, valSideB, valSideC);
    }

    // Açı yayı ve metni çizen yardımcı fonksiyon
    function drawAngleArc(ctxX, ctxY, p1x, p1y, p2x, p2y, label, color) {
        let radius = 30; // Yay yarıçapı
        
        // Başlangıç ve bitiş açılarını hesapla
        let startAngle = Math.atan2(p1y - ctxY, p1x - ctxX);
        let endAngle = Math.atan2(p2y - ctxY, p2x - ctxX);

        ctx.beginPath();
        ctx.moveTo(ctxX, ctxY);
        ctx.arc(ctxX, ctxY, radius, startAngle, endAngle, false);
        
        // Yayı tekrar sadece çizgi olarak çiz (içini boyamadan)
        ctx.beginPath();
        ctx.arc(ctxX, ctxY, radius, startAngle, endAngle, true); 
        
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Metin Konumu: Açıortay yönünde
        // İki vektörün ortalamasını alarak yönü bulabiliriz
        let midAngle = startAngle + (endAngle - startAngle) / 2;
        
        // Eğer açı farkı çok büyükse (örn: -PI ve +PI geçişi) düzeltme gerekebilir
        // Üçgen iç açıları için basit trigonometri:
        let dx = (Math.cos(startAngle) + Math.cos(endAngle));
        let dy = (Math.sin(startAngle) + Math.sin(endAngle));
        let anglePos = Math.atan2(dy, dx);
        
        let textDist = 45;
        let tx = ctxX + Math.cos(anglePos) * textDist;
        let ty = ctxY + Math.sin(anglePos) * textDist;

        ctx.fillStyle = color;
        ctx.font = "bold 14px Nunito";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, tx, ty);
    }

    function drawDot(x, y, label) {
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#2d3436";
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.font = "bold 16px Nunito";
        let ly = (label === 'C') ? y - 25 : y + 25; // Etiketi biraz daha öteye taşıdım
        ctx.fillText(label, x - 6, ly);
    }

    function drawLabel(x, y, text) {
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        let width = ctx.measureText(text).width;
        ctx.fillRect(x - width/2 - 2, y - 12, width + 4, 16);
        
        ctx.fillStyle = "#636e72";
        ctx.font = "bold 14px Nunito";
        ctx.textAlign = "center";
        ctx.fillText(text, x, y);
    }

    function updateStatus(isValid, a, b, c, sa, sb, sc) {
        if (!isValid) {
            typeBadge.innerText = "⚠️ Üçgen Oluşmaz!";
            typeBadge.style.background = "#ff7675";
            return;
        }

        let typeStr = "";
        let ra = Math.round(sa*10);
        let rb = Math.round(sb*10);
        let rc = Math.round(sc*10);

        if (ra === rb && rb === rc) typeStr = "Eşkenar";
        else if (ra === rb || rb === rc || ra === rc) typeStr = "İkizkenar";
        else typeStr = "Çeşitkenar";

        if (a === 90 || b === 90 || c === 90) typeStr += " Dik Üçgen";
        else if (a > 90 || b > 90 || c > 90) typeStr += " Geniş Açılı";
        else typeStr += " Dar Açılı";

        typeBadge.innerText = typeStr;
        typeBadge.style.background = "#0984e3";
    }

    function setScenario(a, b) {
        inpA.value = a;
        inpB.value = b;
        draw();
    }

    inpA.addEventListener('input', draw);
    inpB.addEventListener('input', draw);
    
    // Başlangıç
    draw();

</script>

</body>
</html>
