<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinç Simülasyonu: Kuşbakışı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Ana Kapsayıcı: Yan Yana Düzen */
        .main-container {
            display: flex;
            flex-direction: row;
            background: white;
            padding: 0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 1100px;
            width: 100%;
            overflow: hidden;
        }

        /* Sol Panel: Simülasyon */
        .simulation-panel {
            flex: 2;
            padding: 25px;
            border-right: 2px solid #f1f1f1;
        }

        /* Sağ Panel: Kontroller ve Sonuç */
        .control-panel {
            flex: 1;
            padding: 25px;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        canvas {
            background-color: #ffffff;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            cursor: crosshair;
            background-image: radial-gradient(#dfe6e9 1px, transparent 1px);
            background-size: 20px 20px;
            width: 100%;
            height: auto;
        }

        h2 { color: #2c3e50; margin: 0 0 10px 0; font-size: 1.5rem; }
        p { color: #7f8c8d; margin-bottom: 20px; font-size: 0.95rem; }

        /* Slider Alanı */
        .slider-group {
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            color: #34495e;
            margin-bottom: 8px;
            display: block;
            font-size: 1.1rem;
        }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            transition: .2s;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #slider1::-webkit-slider-thumb { background: #3498db; }
        #slider2::-webkit-slider-thumb { background: #e74c3c; }

        .val-display {
            float: right;
            background: #2c3e50;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        /* Checkbox Alanı */
        .checkbox-wrapper {
            margin-bottom: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #dfe6e9;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-wrapper input {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        .checkbox-wrapper span {
            font-weight: bold;
            color: #2d3436;
        }

        /* Sonuç Kutusu */
        .status-panel {
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
            color: #2d3436;
            transition: all 0.3s ease;
            border: 2px solid #dfe6e9;
            background: white;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .status-hidden { background-color: #ecf0f1; color: #7f8c8d; border-color: #bdc3c7; }
        .status-visible { background-color: #d4edda; color: #155724; border-color: #27ae60; }
        .status-fail { background-color: #f8d7da; color: #721c24; border-color: #c0392b; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .simulation-panel { border-right: none; border-bottom: 2px solid #f1f1f1; }
        }

    </style>
</head>
<body>

<div class="main-container">
    
    <div class="simulation-panel">
        <h2>Vinç ve Üçgen: Tepeden Görünüm</h2>
        <p>Vinç kuleleri sabittir (Mesafe: 6 br). Kolları uzatarak üçgeni oluşturun.</p>
        <canvas id="simCanvas" width="650" height="400"></canvas>
    </div>

    <div class="control-panel">
        
        <div class="slider-group">
            <label style="color:#2980b9">Mavi Vinç <span id="val1" class="val-display">5</span></label>
            <input type="range" id="slider1" min="1" max="9" step="1" value="5">
        </div>

        <div class="slider-group">
            <label style="color:#c0392b">Kırmızı Vinç <span id="val2" class="val-display">4</span></label>
            <input type="range" id="slider2" min="1" max="9" step="1" value="4">
        </div>

        <label class="checkbox-wrapper">
            <input type="checkbox" id="showResultCheck">
            <span>Sonucu Göster</span>
        </label>

        <div id="statusBox" class="status-panel status-hidden">
            Sonuç Gizli
        </div>

    </div>

</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const slider1 = document.getElementById('slider1');
    const slider2 = document.getElementById('slider2');
    const val1Display = document.getElementById('val1');
    const val2Display = document.getElementById('val2');
    const statusBox = document.getElementById('statusBox');
    const resultCheck = document.getElementById('showResultCheck');

    // --- SABİTLER ---
    const SCALE = 35;     // Biraz küçülttük ki sığsın
    const DISTANCE = 6;   
    
    const CENTER_Y = canvas.height / 2;
    const CENTER_X = canvas.width / 2;
    
    const c1 = { x: CENTER_X - (DISTANCE/2 * SCALE), y: CENTER_Y };
    const c2 = { x: CENTER_X + (DISTANCE/2 * SCALE), y: CENTER_Y };

    function draw() {
        let r1 = parseInt(slider1.value);
        let r2 = parseInt(slider2.value);
        let showResult = resultCheck.checked;

        val1Display.innerText = r1 + " br";
        val2Display.innerText = r2 + " br";

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- ÇİZİM ---
        drawPoint(c1, "Mavi", "#2980b9");
        drawPoint(c2, "Kırmızı", "#c0392b");

        // Taban çizgisi
        ctx.beginPath();
        ctx.moveTo(c1.x, c1.y);
        ctx.lineTo(c2.x, c2.y);
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 12px Arial";
        ctx.fillText(`6 br`, CENTER_X - 10, CENTER_Y + 20);

        // Çemberler
        drawCircle(c1, r1 * SCALE, "rgba(52, 152, 219, 0.2)");
        drawCircle(c2, r2 * SCALE, "rgba(231, 76, 60, 0.2)");

        // Hesaplama
        let intersection = getIntersection(r1, r2, DISTANCE);
        let msg = "";
        let className = "";

        if (intersection) {
            let px = c1.x + (intersection.x * SCALE);
            let py = c1.y - (intersection.y * SCALE); 

            // Üçgen
            ctx.beginPath();
            ctx.moveTo(c1.x, c1.y);
            ctx.lineTo(c2.x, c2.y);
            ctx.lineTo(px, py);
            ctx.closePath();
            ctx.fillStyle = "rgba(46, 204, 113, 0.2)";
            ctx.fill();

            drawArm(c1, {x: px, y: py}, "#3498db", r1);
            drawArm(c2, {x: px, y: py}, "#e74c3c", r2);

            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#27ae60";
            ctx.fill();

            // Mesaj Hazırla
            let type = getTriangleType(r1, r2, DISTANCE);
            msg = `${type}<br><span style='font-size:0.8em; font-weight:normal'>Kenarlar: ${r1}, ${r2}, ${DISTANCE}</span>`;
            className = "status-visible";

        } else {
            // Hata Durumu
            let endX1 = c1.x + (r1 * SCALE);
            drawArm(c1, {x: endX1, y: c1.y}, "#3498db", r1);

            let endX2 = c2.x - (r2 * SCALE);
            drawArm(c2, {x: endX2, y: c2.y}, "#e74c3c", r2);

            if (r1 + r2 < DISTANCE) msg = "Kollar yetişmiyor!";
            else if (Math.abs(r1 - r2) > DISTANCE) msg = "Biri çok uzun!";
            else msg = "Üçgen oluşmaz.";
            
            className = "status-fail";
        }

        // --- SONUÇ KUTUSU GÜNCELLEME ---
        if (showResult) {
            statusBox.innerHTML = msg;
            statusBox.className = "status-panel " + className;
        } else {
            statusBox.innerHTML = "Sonuç Gizli<br><span style='font-size:0.8em; font-weight:normal'>(Görmek için kutucuğu işaretle)</span>";
            statusBox.className = "status-panel status-hidden";
        }
    }

    // --- YARDIMCI FONKSİYONLAR ---

    function drawPoint(p, label, color) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.fillStyle = "#2c3e50";
        ctx.font = "12px sans-serif";
        ctx.fillText(label, p.x - 15, p.y + 20);
    }

    function drawCircle(center, r, color) {
        ctx.beginPath();
        ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawArm(start, end, color, lengthVal) {
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.stroke();

        let midX = (start.x + end.x) / 2;
        let midY = (start.y + end.y) / 2;
        
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(midX, midY, 8, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(lengthVal, midX, midY);
    }

    function getIntersection(r1, r2, d) {
        if (r1 + r2 <= d) return null;
        if (Math.abs(r1 - r2) >= d) return null;

        let x = (r1*r1 - r2*r2 + d*d) / (2*d);
        let y = Math.sqrt(r1*r1 - x*x);
        return { x: x, y: y };
    }

    function getTriangleType(r1, r2, d) {
        if (r1 === r2 && r2 === d) return "EŞKENAR ÜÇGEN";
        if (r1 === r2 || r1 === d || r2 === d) return "İKİZKENAR ÜÇGEN";
        
        let sides = [r1, r2, d].sort((a,b)=>a-b);
        if (sides[0]**2 + sides[1]**2 === sides[2]**2) return "DİK ÜÇGEN";
        
        return "ÇEŞİTKENAR ÜÇGEN";
    }

    slider1.addEventListener('input', draw);
    slider2.addEventListener('input', draw);
    resultCheck.addEventListener('change', draw);

    draw();

</script>
</body>
</html>
