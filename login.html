<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - 4 Köşe Matematik</title>
    <link rel="icon" href="img/4kösemat.png" type="image/png"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 460px;
            margin: 4rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 33, 71, 0.12);
            border: 1px solid rgba(0, 33, 71, 0.08);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #4CAF50, #388E3C);
            border-radius: 20px 20px 0 0;
        }

        .centered-heading {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #002147;
            margin-bottom: 2rem;
        }

        .centered-heading::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: #4CAF50;
            margin: 0.8rem auto 0;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #4CAF50;
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            background-color: #fdfdfd;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        .form-group input[type="file"] {
            padding: 0.6rem;
            border: 2px dashed #ccc;
            background-color: #f9f9f9;
            cursor: pointer;
        }

        .form-group input[type="file"]:focus {
            border-color: #4CAF50;
            background-color: white;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #4CAF50;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        /* FORM GEÇİŞİ - GÖRÜNÜR OLMA */
        .login-form, .register-form {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .login-form.active, .register-form.active {
            display: block;
            opacity: 1;
        }

        @media (max-width: 480px) {
            .login-container { margin: 2rem auto; padding: 2rem 1.5rem; }
            .centered-heading { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="page-container">
    <header>
        <nav class="navbar">
            <a href="#"><img src="img/4kösematematik.png" alt="Logo" class="logo"/></a>
        </nav>
    </header>

    <main class="container">
        <div class="login-container">
            <h2 class="centered-heading">Giriş Yap</h2>

            <!-- GİRİŞ FORMU (BAŞLANGIÇTA GÖRÜNÜR) -->
            <form id="loginForm" class="login-form active">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Şifre" required>
                </div>
                <button type="submit" class="btn">Giriş Yap</button>
                <div id="loginMsg" class="message error"></div>
                <div class="toggle-link" onclick="toggleForm('registerForm')">
                    Henüz üye değil misiniz? Üye Ol
                </div>
            </form>

            <!-- ÜYE OL FORMU (BAŞLANGIÇTA GİZLİ) -->
            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="Ad Soyad" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="regTc" maxlength="11" placeholder="T.C. Kimlik No" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-calendar"></i>
                    <input type="date" id="regBirthDate" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="E-posta" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-file-pdf"></i>
                    <input type="file" id="regTeacherCert" accept=".pdf" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Şifre" required>
                </div>
                <button type="submit" class="btn">Üye Ol</button>
                <div id="registerMsg" class="message success"></div>
                <div class="toggle-link" onclick="toggleForm('loginForm')">
                    Zaten üye misiniz? Giriş Yap
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p><a href="mailto:destek4kosematematik@gmail.com">destek4kosematematik@gmail.com</a><br>
            Copyright © 2025 4 Köşe Matematik. Tüm Hakları Saklıdır.</p>
    </footer>
</div>

<script>
    // === SABİT KULLANICILAR ===
    const VALID_USERS = [
        {username: "ogretmen", password: "12345", name: "Öğretmen"},
        {username: "admin", password: "deneme", name: "Yönetici"},
        {username: "veli42", password: "veli2025", name: "Ali"},
    ];

    // === FORM GEÇİŞİ (ÇALIŞIYOR!) ===
    function toggleForm(formId) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        if (formId === 'loginForm') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
    }

    // === GİRİŞ YAP ===
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('loginMsg');

        const user = VALID_USERS.find(u => u.username === username && u.password === password);

        if (user) {
            localStorage.setItem('userName', user.name);
            localStorage.setItem('loginTime', Date.now().toString());
            msg.className = 'message success';
            msg.textContent = 'Giriş başarılı! Yönlendiriliyorsunuz...';
            msg.style.display = 'block';
            setTimeout(() => window.location.href = 'index.html', 1200);
        } else {
            msg.className = 'message error';
            msg.textContent = 'Kullanıcı adı veya şifre yanlış.';
            msg.style.display = 'block';
        }
    });

    // === ÜYE OL ===
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const tc = document.getElementById('regTc').value;
        const birthDate = document.getElementById('regBirthDate').value;
        const email = document.getElementById('regEmail').value.trim();
        const fileInput = document.getElementById('regTeacherCert');
        const password = document.getElementById('regPassword').value;
        const msg = document.getElementById('registerMsg');

        if (!fileInput.files[0] || !fileInput.files[0].type.includes('pdf')) {
            alert('Lütfen PDF formatında belge yükleyin.');
            return;
        }

        const reader = new FileReader();
        reader.onload = function () {
            const request = {
                name, tc, birthDate, email, password,
                fileName: fileInput.files[0].name,
                fileData: reader.result.split(',')[1],
                timestamp: new Date().toISOString()
            };

            let requests = JSON.parse(localStorage.getItem('registrationRequests') || '[]');
            requests.push(request);
            localStorage.setItem('registrationRequests', JSON.stringify(requests));

            msg.className = 'message success';
            msg.textContent = 'Üyelik talebiniz alındı! Onay bekleniyor...';
            msg.style.display = 'block';

            document.getElementById('registerForm').reset();
        };
        reader.readAsDataURL(fileInput.files[0]);
    });

    // === Zaten Giriş Yapılmışsa Yönlendir ===
    window.addEventListener('load', () => {
        if (localStorage.getItem('userName')) {
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
